// ---------------------------------------------------------------- audio (synthetic, procedural)
class Sound {

    const O = (f, g0 = 0) => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 3; fl.frequency.value = f * 1.4; const g = c.createGain(); g.gain.value = g0; o.connect(fl); fl.connect(g); g.connect(this.master); o.start(); return { o, fl, g }; };
    n.w1 = O(1000); n.w2 = O(1030); n.hyd = O(62); n.hyd.fl.type = 'lowpass'; n.hyd.fl.frequency.value = 320; n.hyd.fl.Q.value = 0.7;

const snd = new Sound();

// ---------------------------------------------------------------- app state / playback
let tNow = 0, playing = false, last = 0, prevT = 0, curState = TL.state(0), recorder = null, recChunks = [], recording = false, inspectOn = false;
function seek(t) { tNow = clamp(t, 0, DURATION); prevT = tNow; $('scrub').value = tNow; if (!playing) snd.silence(); }
function fmt(t) { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; }
function play() { if (tNow >= DURATION - 0.01) seek(0); playing = true; $('play').classList.add('on'); if (snd.ctx) snd.ctx.resume(); last = performance.now(); }

$('play').onclick = play; $('pause').onclick = pause; $('restart').onclick = () => { seek(0); play(); };
$('scrub').oninput = (e) => seek(parseFloat(e.target.value));
SCENES.forEach((sc) => { const b = document.createElement('button'); b.textContent = sc.n; b.title = sc.title; b.onclick = () => seek(sc.t0); $('scenes').appendChild(b); });
$('snd').onclick = () => { if (!snd.ctx) { snd.start(); snd.muted = false; if (!playing) snd.ctx.suspend(); } else snd.setMute(!snd.muted); snd.setMute(snd.muted); $('snd').textContent = 'Sound: ' + (snd.muted ? 'off' : 'on'); $('snd').classList.toggle('on', !snd.muted); };

// inspect helpers
const inspHelpers = [];
function buildInspect() {
  const bh = new THREE.Box3Helper(new THREE.Box3(), 0x00ff88); bh.visible = false; scene.add(bh); inspHelpers.push(bh); S_.bh = bh;
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(-10, DECK_Y + 0.1, 0), new V3(100, DECK_Y + 0.1, 0)]), new THREE.LineBasicMaterial({ color: 0xff00ff })); line.visible = false; scene.add(line); inspHelpers.push(line);
  const sp = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false })); sp.visible = false; scene.add(sp); inspHelpers.push(sp); S_.sp = sp;
  const sp2 = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0x00ffff, depthTest: false })); sp2.visible = false; scene.add(sp2); inspHelpers.push(sp2); S_.sp2 = sp2;

  S_.bh.box.setFromObject(acft); S_.sp.position.set(s.gx + S_.tipDx, tipYw, 0); S_.sp2.position.set(tipXhold + s.shuttleX, DECK_Y + 0.3, 0);

// ---------------------------------------------------------------- main loop
let oceanObj;
function frame(now) {
  requestAnimationFrame(frame);
  const dtr = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) { const t0 = tNow; tNow += dtr; if (tNow >= DURATION) { tNow = DURATION; playing = false; $('play').classList.remove('on'); snd.silence(); if (recording) setTimeout(() => recorder && recorder.stop(), 400); } if (snd.ctx && !snd.muted && tNow - t0 < 0.3) for (const e of TL.EVENTS) if (t0 < e.t && tNow >= e.t) snd.burst(e.id); prevT = tNow; $('scrub').value = tNow; }
  const t = tNow, s = curState = TL.state(t); uT.value = t; $('time').textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  updateAircraft(s); updateCatapult(s); applyCut(s.cut);

}

// ---------------------------------------------------------------- boot
(async () => {
  try {
    if (!renderer.capabilities.isWebGL2 && !gl.getContext) fatal('WebGL not available');
    loadingEl.textContent = 'Loading HDRI…';
    try { const hdr = await new RGBELoader(mgr).loadAsync(FILES.hdr); hdr.mapping = THREE.EquirectangularReflectionMapping; const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(hdr).texture; scene.background = hdr; scene.backgroundBlurriness = 0.02; scene.environmentIntensity = 0.95; report.push(`${FILES.hdr}: Radiance RGBE HDR, loaded with RGBELoader (overcast sky: soft IBL; a supplementary sun light gives shadow definition)`); }

    const og = await loadOcean(); oceanObj = buildOcean(og);

    loadingEl.style.display = 'none';
    status((warn.length ? 'WARNINGS:\n' + warn.join('\n') + '\n' : '') + 'Ready. Press Play. (Sound is off until you click “Sound”.)');
    console.log('ASSET REPORT\n' + report.join('\n')); if (warn.length) console.warn(warn.join('\n'));

})();
